name: CI

on:
  push:
    branches: [main, "ubuntu/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q -m "not gpu"
        env:
          CUDA_VISIBLE_DEVICES: "-1"
          OMP_NUM_THREADS: "2"

      - name: Check audio resampling without audio hardware
        run: node --test tests/test_worklet.cjs

      - name: Build package
        run: uv build

      - name: Check repository boundaries
        run: uv run python scripts/check_repository.py

      - name: Check Bash syntax
        if: runner.os == 'Linux'
        run: |
          for file in Install.sh Start.sh installers/*.sh scripts/bootstrap-linux.sh; do bash -n "$file"; done

      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem installers, scripts, tests -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }

      - name: Test Windows installer error handling
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_windows_installer.ps1

  installers:
    name: Installer bundles
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build committed source bundles (no models)
        run: python3 scripts/build_installers.py
      - uses: actions/upload-artifact@v4
        with:
          name: lecturebridge-installers
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 30
