[project]
name = "lecturebridge"
version = "0.1.0"
description = "Local-first real-time English lecture captions with optional Vietnamese translation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12,<13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "whisperlivekit[translation]==0.2.26",
]

[project.scripts]
lecturebridge-live = "lecturebridge.live:main"
lecturebridge-models = "lecturebridge.model_store:main"
lecturebridge-preflight = "lecturebridge.preflight:main"
lecturebridge-transcribe = "lecturebridge.offline:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
markers = [
    "gpu: opt-in test that loads an ASR model on CUDA",
]
