[project]
name = "lecturebridge"
version = "0.1.0"
description = "Local-first real-time English to Vietnamese lecture translation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
]

[project.scripts]
lecturebridge-transcribe = "lecturebridge.offline:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
